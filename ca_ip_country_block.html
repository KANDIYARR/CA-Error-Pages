<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CareersCloud - Access Not Available in Your Region</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body {
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#FFF1F3 0%,#FDE8EB 18%,#EFF4FF 72%,#E6EFFF 100%);
      display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden; color:#1E293B
    }
    body::before{content:'';position:absolute;width:700px;height:700px;left:-120px;top:-160px;background:radial-gradient(ellipse at center,rgba(233,64,87,0.12),transparent 70%);pointer-events:none}
    body::after{content:'';position:absolute;width:800px;height:800px;right:-180px;bottom:-200px;background:radial-gradient(ellipse at center,rgba(58,123,223,0.14),transparent 70%);pointer-events:none}
    .pattern{position:absolute;inset:0;pointer-events:none;opacity:0.06}
    .glass{
      width:100%; max-width:560px;
      background:rgba(255,255,255,0.82); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.7); border-radius:28px;
      box-shadow:0 20px 60px -12px rgba(31,41,55,0.14),0 8px 24px -8px rgba(31,41,55,0.08);
      padding:40px 36px 28px; position:relative; z-index:2
    }
    .logo-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px}
    .logo{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.08))}
    .brand{font-weight:700;letter-spacing:-0.02em;font-size:22px;color:#EA2042}
    .brand span{color:#159FDC}
    .tagline{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#066AC6;font-weight:600;margin-top:-6px}
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF;
      font-size:11px;font-weight:700;letter-spacing:0.12em;padding:7px 14px;border-radius:999px;text-transform:uppercase
    }
    .badge-dot{width:6px;height:6px;border-radius:999px;background:#3B82F6;box-shadow:0 0 0 4px rgba(59,130,246,0.18);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
    h1{font-size:28px;line-height:1.15;letter-spacing:-0.03em;font-weight:700;color:#0F172A;text-align:center;margin:22px 0 12px}
    p.lead{font-size:15.5px;line-height:1.6;color:#475569;text-align:center;max-width:420px;margin:0 auto 22px}
    .waf-info{
      display:flex;gap:12px;background:#F8FAFF;border:1px solid #DBEAFE;border-radius:14px;
      padding:14px 16px;margin:0 auto 22px;text-align:left
    }
    .waf-icon{
      width:36px;height:36px;border-radius:10px;background:#EFF6FF;border:1px solid #BFDBFE;
      display:flex;align-items:center;justify-content:center;flex-shrink:0
    }
    .waf-text{font-size:13px;line-height:1.5;color:#475569}
    .waf-text strong{color:#0F172A;display:block;font-size:13px;margin-bottom:2px}
    .country-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}
    .country-card{display:flex;align-items:center;gap:10px;background:white;border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px}
    .country-icon{width:32px;height:32px;border-radius:8px;background:#F8FAFC;border:1px solid #F1F5F9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .country-label{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#94A3B8}
    .country-value{font-size:13px;font-weight:600;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .btns{display:flex;gap:12px;justify-content:center;margin:0 0 28px;flex-wrap:wrap}
    .btn{appearance:none;border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
    .btn-primary{background:#0F172A;color:white;box-shadow:0 8px 20px -8px rgba(15,23,42,0.5)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px -10px rgba(15,23,42,0.6)}
    .btn-ghost{background:white;border:1px solid #E2E8F0;color:#334155}
    .tokens{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px;background:#F8FAFC;border:1px solid #F1F5F9;border-radius:14px;margin-top:4px}
    .token{display:flex;flex-direction:column;gap:4px}
    .token-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#94A3B8}
    .token-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;color:#334155;background:white;border:1px solid #E2E8F0;padding:6px 9px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .footer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .footer-left{font-size:11px;color:#94A3B8}
    .footer-right{font-size:11px;color:#94A3B8;display:flex;gap:12px}
    @media(max-width:520px){.glass{padding:28px 22px 20px;border-radius:22px}h1{font-size:24px}.tokens{grid-template-columns:1fr}.country-grid{grid-template-columns:1fr}}
  </style>
</head>
